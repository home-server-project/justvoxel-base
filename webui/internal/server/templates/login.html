{{define "login.html"}}<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JustVoxel - {{.Title}}</title><link rel="stylesheet" href="/static/app.css"></head>
<body><main class="login-shell"><section class="panel login-panel"><p class="eyebrow">Minecraft Server Appliance</p><h1>JustVoxel</h1><p class="muted">Sign in as the JustVoxel administrator.</p>{{if .Message}}<div class="notice">{{.Message}}</div>{{end}}{{if .Error}}<div class="alert">{{.Error}}</div>{{end}}<form method="post" action="/login"><label>Username<input name="username" value="voxel" autocomplete="username" required></label><label>Password<input type="password" name="password" autocomplete="current-password" required autofocus></label><button type="submit">Sign in</button></form><p class="foot">WebUI {{.Version}} · Management API {{.ManagementAPI}}</p></section></main></body></html>{{end}}
