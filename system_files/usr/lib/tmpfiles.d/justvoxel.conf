# Base persistent appliance state. Minecraft-specific subdirectories are created
# by the runtime setup phase, not by the Step 1 image foundation.
d /var/lib/justvoxel 0755 root root -

# Persistent Management Agent operation metadata. These paths are root-only;
# operation journals intentionally contain no secrets or arbitrary command output.
d /var/lib/justvoxel/management 0700 root root -
d /var/lib/justvoxel/management/operations 0700 root root -

# Private rollback evidence for transactional first-run setup.
d /var/lib/justvoxel/management/transactions 0700 root root -
