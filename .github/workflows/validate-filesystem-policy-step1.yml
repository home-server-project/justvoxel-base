name: Validate filesystem policy Step 1

on:
  pull_request:
    branches: [testing]
    paths:
      - '.github/workflows/validate-filesystem-policy-step1.yml'

jobs:
  validate:
    name: Filesystem capability and policy
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout validation branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Validate filesystem policy source
        shell: bash
        run: |
          set -euo pipefail
          bash tests/test-storage-filesystem-policy-source.sh
          bash tests/test-storage-action-safety-source.sh
          bash tests/test-storage-mount-persistence-safety-source.sh

      - name: Validate AlmaLinux 10 FAT and exFAT kernel capability
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm almalinux:10 bash -lc '
            set -euo pipefail
            dnf install -y kernel-core kernel-modules-core
            compgen -G "/usr/lib/modules/*/kernel/fs/fat/fat.ko*" >/dev/null
            compgen -G "/usr/lib/modules/*/kernel/fs/fat/vfat.ko*" >/dev/null
            compgen -G "/usr/lib/modules/*/kernel/fs/exfat/exfat.ko*" >/dev/null
          '
