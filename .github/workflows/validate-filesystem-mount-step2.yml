name: Validate filesystem mount Step 2

on:
  pull_request:
    branches: [testing]
    paths:
      - '.github/workflows/validate-filesystem-mount-step2.yml'

jobs:
  validate:
    name: Portable filesystem mount backend
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout validation branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Validate storage mount source
        shell: bash
        run: |
          set -euo pipefail
          bash tests/test-storage-filesystem-policy-source.sh
          bash tests/test-storage-action-safety-source.sh
          bash tests/test-storage-mount-persistence-safety-source.sh

      - name: Validate NTFS userspace capability
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm almalinux:10 bash -lc '
            set -euo pipefail
            dnf install -y epel-release dnf-plugins-core
            dnf config-manager --set-enabled crb
            dnf install -y ntfs-3g
            command -v mount.ntfs-3g
            mount.ntfs-3g --help >/dev/null
          '
