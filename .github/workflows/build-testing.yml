---
name: testing

on:
  push:
    branches: [testing]
    paths-ignore:
      - '**/README.md'
      - 'docs/**'
      - 'AGENTS.md'
      - '.agents/skills/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-testing
  cancel-in-progress: true

env:
  IMAGE_REPOSITORY: ghcr.io/${{ github.repository_owner }}/justvoxel-base
  CURRENT_TAG: 'testing'
  RECHUNK_MAX_LAYERS: '127'
  OCI_LAYER_LIMIT: '128'
  HOME_SERVER_BASE_IMAGE: ghcr.io/home-server-project/home-server-base-10:stable
  MANAGEMENT_PACKAGE: ghcr.io/home-server-project/justvoxel-management-agent:testing

jobs:
  source-tests:
    name: Source tests
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout testing branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: testing

      - name: Set up Go for WebUI source tests
        uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6
        with:
          go-version: '1.25.x'
          check-latest: true
          cache: false

      - name: Install source-test dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ripgrep podman

      - name: Run shell and mjust regression tests
        shell: bash
        run: |
          set -euo pipefail
          syntax_failures=()
          test_failures=()
          test_count=0
          check_syntax() {
            local script="$1" shebang
            shebang="$(head -n 1 "${script}")" || return 1
            if [[ "${shebang}" =~ ^'#!'[[:space:]]*([^[:space:]]*/)?(env[[:space:]]+)?python3([.][0-9]+)?([[:space:]]|$) ]]; then
              python3 -B -c 'import ast, pathlib, sys; ast.parse(pathlib.Path(sys.argv[1]).read_bytes(), filename=sys.argv[1])' "${script}"
            elif [[ "${shebang}" =~ ^'#!'[[:space:]]*([^[:space:]]*/)?(env[[:space:]]+)?(bash|sh|dash)([[:space:]]|$) ]] || [[ "${shebang}" != '#!'* ]]; then
              # Files without a shebang include sourced shell helpers.
              bash -n "${script}"
            else
              printf 'Unsupported interpreter: %s (%s)\n' "${script}" "${shebang}" >&2
              return 1
            fi
          }
          for script in \
            build_files/*.sh \
            build_files/validate/*.sh \
            mjust/bin/mjust \
            mjust/libexec/* \
            runtime/* \
            tests/*.sh; do
            [[ -f "${script}" ]] || continue
            printf 'Checking syntax: %s\n' "${script}"
            if check_syntax "${script}"; then
              printf 'PASS syntax: %s\n' "${script}"
            else
              printf 'FAIL syntax: %s\n' "${script}" >&2
              syntax_failures+=("${script}")
            fi
          done
          for test_script in tests/test-*.sh; do
            [[ -f "${test_script}" ]] || continue
            test_count=$((test_count + 1))
            printf 'Running test: %s\n' "${test_script}"
            # Real ownership checks need root inside a rootless user namespace.
            test_command=(bash "${test_script}")
            case "${test_script}" in
              tests/test-instance-delete.sh|tests/test-instance-backups.sh|tests/test-instance-restore.sh|tests/test-legacy-backup-restore-exclusion.sh)
                test_command=(podman unshare bash "${test_script}")
                ;;
            esac
            if "${test_command[@]}"; then
              printf 'PASS: %s\n' "${test_script}"
            else
              test_status=$?
              printf 'FAIL: %s (exit %s)\n' "${test_script}" "${test_status}" >&2
              test_failures+=("${test_script}")
            fi
          done
          if (( test_count == 0 )); then
            echo 'ERROR: no shell regression scripts found.' >&2
            exit 1
          fi
          if (( ${#syntax_failures[@]} > 0 )); then
            printf 'Syntax checks failed:\n' >&2
            printf '  %s\n' "${syntax_failures[@]}" >&2
          fi
          if (( ${#test_failures[@]} > 0 )); then
            printf 'Regression tests failed:\n' >&2
            printf '  %s\n' "${test_failures[@]}" >&2
          fi
          if (( ${#syntax_failures[@]} > 0 || ${#test_failures[@]} > 0 )); then
            exit 1
          fi

      - name: Check WebUI JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          for script in webui/internal/server/static/*.js; do
            [[ -f "${script}" ]] || continue
            node --check "${script}"
          done

  build:
    name: Build JustVoxel Base testing
    needs: [source-tests]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout testing branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: testing

      - name: Set up Go for local WebUI build
        uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6
        with:
          go-version: '1.25.x'
          check-latest: true
          cache: false

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y podman skopeo jq

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v3.1.3'

      - name: Login to GHCR
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p "${HOME}/.docker"
          printf '%s' "${GHCR_TOKEN}" | podman login \
            --authfile "${HOME}/.docker/config.json" \
            ghcr.io --username "${GITHUB_ACTOR}" --password-stdin
          chmod 600 "${HOME}/.docker/config.json"

      - name: Verify Home Server Base stable signature
        shell: bash
        run: |
          set -euo pipefail
          cosign verify \
            --new-bundle-format=false \
            --key cosign.pub \
            "${HOME_SERVER_BASE_IMAGE}" >/dev/null

      - name: Build local WebUI artifact
        id: webui
        shell: bash
        run: |
          set -euo pipefail
          ./build_files/build-webui.sh "${GITHUB_SHA}" "${GITHUB_WORKSPACE}/build_artifacts/webui"
          version="$(jq -r '.version' build_artifacts/webui/webui-release.json)"
          source_commit="$(jq -r '.source_commit' build_artifacts/webui/webui-release.json)"
          management_api="$(jq -r '.management_api' build_artifacts/webui/webui-release.json)"
          [[ -n "${version}" && "${version}" != "null" ]]
          [[ "${source_commit}" == "${GITHUB_SHA}" ]]
          [[ "${management_api}" == "v1" ]]
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Resolve Management package inputs
        id: management-inputs
        shell: bash
        run: |
          set -euo pipefail
          base_digest="$(skopeo inspect --authfile "${HOME}/.docker/config.json" --raw "docker://${HOME_SERVER_BASE_IMAGE}" | sha256sum | cut -d ' ' -f 1)"
          [[ "${base_digest}" =~ ^[0-9a-f]{64}$ ]]
          base_identity="${HOME_SERVER_BASE_IMAGE}@sha256:${base_digest}"
          # Git tree entries include paths, modes and blob IDs, never timestamps.
          input_identity="$({
            git ls-tree -r -z HEAD -- management templates mjust system_files \
              build_files/build-common.sh \
              build_files/build-management-agent.sh \
              build_files/management-agent-package.Containerfile \
              tests/run-pam-integration-alma.sh
            printf '%s\0' "${base_identity}" 'management-api=v1'
          } | sha256sum | cut -d ' ' -f 1)"
          echo "identity=${input_identity}" >> "${GITHUB_OUTPUT}"
          echo "base=${base_identity}" >> "${GITHUB_OUTPUT}"

      - name: Inspect internal Management package
        id: management-package
        shell: bash
        env:
          INPUT_IDENTITY: ${{ steps.management-inputs.outputs.identity }}
          BASE_IDENTITY: ${{ steps.management-inputs.outputs.base }}
        run: |
          set -euo pipefail
          metadata="${RUNNER_TEMP}/management-package.json"
          inspect_log="${RUNNER_TEMP}/management-package-inspect.log"
          echo 'rebuild=true' >> "${GITHUB_OUTPUT}"
          if skopeo inspect --authfile "${HOME}/.docker/config.json" \
            "docker://${MANAGEMENT_PACKAGE}" >"${metadata}" 2>"${inspect_log}"; then
            if jq -e --arg input "${INPUT_IDENTITY}" --arg base "${BASE_IDENTITY}" '
              .Labels["io.home-server-project.justvoxel.management-input"] == $input and
              .Labels["io.home-server-project.justvoxel.management-base"] == $base and
              .Labels["io.home-server-project.justvoxel.management-api"] == "v1"
            ' "${metadata}" >/dev/null; then
              digest="$(jq -r '.Digest' "${metadata}")"
              [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]
              package_ref="${MANAGEMENT_PACKAGE%:*}@${digest}"
              if cosign verify --new-bundle-format=false --key cosign.pub "${package_ref}" >/dev/null; then
                echo "digest=${digest}" >> "${GITHUB_OUTPUT}"
                echo 'rebuild=false' >> "${GITHUB_OUTPUT}"
              else
                echo 'Management package signature verification failed; package is not reusable and will be rebuilt from source.'
              fi
            fi
          else
            # GHCR can deny inspection before the package has been created.
            # Rebuild from source; any authentication/publish failure remains fatal.
            echo 'No readable Management package metadata; rebuilding.'
          fi

      - name: Verify and extract reusable Management Agent
        if: steps.management-package.outputs.rebuild == 'false'
        shell: bash
        env:
          DIGEST: ${{ steps.management-package.outputs.digest }}
        run: |
          set -euo pipefail
          package_ref="${MANAGEMENT_PACKAGE%:*}@${DIGEST}"
          cosign verify --new-bundle-format=false --key cosign.pub "${package_ref}" >/dev/null
          sudo podman pull --authfile "${HOME}/.docker/config.json" "${package_ref}"
          container="$(sudo podman create "${package_ref}" /unused)"
          trap 'sudo podman rm "${container}" >/dev/null' EXIT
          mkdir -p build_artifacts/management
          sudo podman cp "${container}:/artifacts/management-agent" build_artifacts/management/management-agent
          sudo chmod 0755 build_artifacts/management/management-agent
          test -f build_artifacts/management/management-agent
          test -x build_artifacts/management/management-agent

      - name: Rebuild and validate Management Agent on Home Server Base 10
        if: steps.management-package.outputs.rebuild == 'true'
        shell: bash
        env:
          BASE_IDENTITY: ${{ steps.management-inputs.outputs.base }}
        run: |
          set -euo pipefail
          mkdir -p build_artifacts/management
          sudo podman run --rm \
            --pull=always \
            --authfile "${HOME}/.docker/config.json" \
            --security-opt=label=disable \
            -v "${PWD}:/repo:ro" \
            -v "${PWD}/system_files/usr/libexec/justvoxel:/system_files/usr/libexec/justvoxel:ro" \
            -v "${PWD}/system_files/etc/pam.d/justvoxel:/etc/pam.d/justvoxel:ro" \
            -v "${PWD}/tests/run-pam-integration-alma.sh:/run-pam-integration-alma.sh:ro" \
            -v "${PWD}/build_artifacts/management:/out" \
            "${HOME_SERVER_BASE_IMAGE}" \
            /bin/bash /repo/build_files/build-management-agent.sh
          # Fail if the stable channel moved while validation was running.
          base_digest="$(skopeo inspect --authfile "${HOME}/.docker/config.json" --raw "docker://${HOME_SERVER_BASE_IMAGE}" | sha256sum | cut -d ' ' -f 1)"
          [[ "${BASE_IDENTITY}" == "${HOME_SERVER_BASE_IMAGE}@sha256:${base_digest}" ]]
          sudo chmod 0755 build_artifacts/management/management-agent
          test -f build_artifacts/management/management-agent
          test -x build_artifacts/management/management-agent

      - name: Publish internal Management package
        id: management-push
        if: steps.management-package.outputs.rebuild == 'true'
        shell: bash
        env:
          INPUT_IDENTITY: ${{ steps.management-inputs.outputs.identity }}
          BASE_IDENTITY: ${{ steps.management-inputs.outputs.base }}
        run: |
          set -euo pipefail
          sudo podman build --format oci \
            --build-arg "MANAGEMENT_INPUT_IDENTITY=${INPUT_IDENTITY}" \
            --build-arg "HOME_SERVER_BASE_IDENTITY=${BASE_IDENTITY}" \
            --build-arg "SOURCE_COMMIT=${GITHUB_SHA}" \
            --tag "${MANAGEMENT_PACKAGE}" \
            --file "${GITHUB_WORKSPACE}/build_files/management-agent-package.Containerfile" \
            build_artifacts/management
          sudo podman push --authfile "${HOME}/.docker/config.json" \
            --digestfile "${RUNNER_TEMP}/management-package.digest" "${MANAGEMENT_PACKAGE}"
          digest="$(cat "${RUNNER_TEMP}/management-package.digest")"
          [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"

      - name: Sign and verify internal Management package digest
        if: steps.management-package.outputs.rebuild == 'true'
        shell: bash
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          DIGEST: ${{ steps.management-push.outputs.digest }}
        run: |
          set -euo pipefail
          package_ref="${MANAGEMENT_PACKAGE%:*}@${DIGEST}"
          cosign sign -y \
            --new-bundle-format=false \
            --use-signing-config=false \
            --key env://COSIGN_PRIVATE_KEY "${package_ref}"
          cosign verify --new-bundle-format=false --key cosign.pub "${package_ref}" >/dev/null

      - name: Record Management result
        id: management
        shell: bash
        env:
          REBUILD: ${{ steps.management-package.outputs.rebuild }}
        run: |
          set -euo pipefail
          if [[ "${REBUILD}" == 'true' ]]; then
            echo 'result=rebuilt' >> "${GITHUB_OUTPUT}"
          else
            echo 'result=reused' >> "${GITHUB_OUTPUT}"
          fi

      - name: Build JustVoxel Base
        shell: bash
        env:
          WEBUI_VERSION: ${{ steps.webui.outputs.version }}
        run: |
          set -euo pipefail
          sudo podman build \
            --pull=always \
            --security-opt=label=disable \
            --cap-add=all \
            --device /dev/fuse \
            --build-arg "HOME_SERVER_BASE_IMAGE=${HOME_SERVER_BASE_IMAGE}" \
            --build-arg "JUSTVOXEL_BASE_REPOSITORY=${IMAGE_REPOSITORY}" \
            --build-arg "JUSTVOXEL_VM_REPOSITORY=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/justvoxel-vm" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --label "io.home-server-project.justvoxel.webui.version=${WEBUI_VERSION}" \
            --label "io.home-server-project.justvoxel.management-api=v1" \
            --target justvoxel-base \
            --tag justvoxel-base:unrechunked \
            --file Containerfile \
            .

      - name: Rechunk JustVoxel Base
        id: rechunk
        shell: bash
        run: |
          set -euo pipefail
          rechunk_tmp="${RUNNER_TEMP}/justvoxel-base-rechunk"
          sudo mkdir -p "${rechunk_tmp}"
          sudo chmod 1777 "${rechunk_tmp}"
          sudo podman run --rm --privileged \
            -v /var/lib/containers:/var/lib/containers \
            -v "${rechunk_tmp}:/var/tmp" \
            --entrypoint /usr/libexec/bootc-base-imagectl \
            localhost/justvoxel-base:unrechunked \
            rechunk \
            --max-layers "${RECHUNK_MAX_LAYERS}" \
            localhost/justvoxel-base:unrechunked \
            localhost/justvoxel-base:test
          layer_count="$(sudo skopeo inspect --raw containers-storage:localhost/justvoxel-base:test | jq -r '.layers | length')"
          [[ "${layer_count}" =~ ^[0-9]+$ ]]
          (( layer_count <= OCI_LAYER_LIMIT ))
          echo "layers=${layer_count}" >> "${GITHUB_OUTPUT}"

      - name: Validate completed Base image
        shell: bash
        run: |
          set -euo pipefail
          sudo podman run --rm \
            --entrypoint /bin/bash \
            justvoxel-base:test \
            -c '
              set -euo pipefail
              /usr/libexec/justvoxel/health/common
              /usr/bin/glances -w --disable-webui --bind 127.0.0.1 --port 61208 --config /etc/glances/glances.conf >/tmp/glances-runtime.log 2>&1 &
              glances_pid=$!
              cleanup_glances() {
                  kill "${glances_pid}" >/dev/null 2>&1 || true
                  wait "${glances_pid}" >/dev/null 2>&1 || true
              }
              trap cleanup_glances EXIT
              ready=0
              for _ in $(seq 1 20); do
                  if curl -fsS --max-time 1 http://127.0.0.1:61208/api/4/all | jq -e "has(\"cpu\") and has(\"mem\")" >/dev/null; then
                      ready=1
                      break
                  fi
                  sleep 0.5
              done
              if [[ "${ready}" -ne 1 ]]; then
                  cat /tmp/glances-runtime.log >&2
                  exit 1
              fi
              cleanup_glances
              trap - EXIT
              rm -f /tmp/glances-runtime.log /tmp/glances-root.log
              bootc container lint --fatal-warnings
            '

      - name: Push testing Base image
        id: push
        shell: bash
        run: |
          set -euo pipefail
          build_tag="testing-$(date -u +%Y%m%d)-${GITHUB_SHA:0:7}"
          echo "BUILD_TAG=${build_tag}" >> "${GITHUB_ENV}"

          sudo podman tag justvoxel-base:test "${IMAGE_REPOSITORY}:${build_tag}"
          sudo podman tag justvoxel-base:test "${IMAGE_REPOSITORY}:${CURRENT_TAG}"

          sudo podman push \
            --authfile "${HOME}/.docker/config.json" \
            --digestfile /tmp/digest \
            "${IMAGE_REPOSITORY}:${build_tag}"
          sudo podman push \
            --authfile "${HOME}/.docker/config.json" \
            "${IMAGE_REPOSITORY}:${CURRENT_TAG}"

          digest="$(cat /tmp/digest)"
          [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"

      - name: Sign testing Base image digest
        shell: bash
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          signing_log="$(mktemp "${RUNNER_TEMP}/cosign-sign.XXXXXX")"
          trap 'rm -f "${signing_log}"' EXIT
          if cosign sign -y \
            --new-bundle-format=false \
            --use-signing-config=false \
            --key env://COSIGN_PRIVATE_KEY \
            "${IMAGE_REPOSITORY}@${DIGEST}" >"${signing_log}" 2>&1; then
            cat "${signing_log}"
          else
            signing_status=$?
            cat "${signing_log}"
            if grep -Fq '[409]' "${signing_log}" && \
               grep -Fq 'an equivalent entry already exists in the transparency log' "${signing_log}"; then
              echo 'Rekor reports an equivalent entry already exists (409); verifying the exact pushed digest.'
              cosign verify \
                --new-bundle-format=false \
                --key cosign.pub \
                "${IMAGE_REPOSITORY}@${DIGEST}"
              echo "Existing signature for the exact digest ${IMAGE_REPOSITORY}@${DIGEST} was verified."
            else
              exit "${signing_status}"
            fi
          fi

      - name: Verify testing Base signature
        shell: bash
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          cosign verify \
            --new-bundle-format=false \
            --key cosign.pub \
            "${IMAGE_REPOSITORY}@${DIGEST}"

      - name: Build summary
        if: always()
        shell: bash
        env:
          MANAGEMENT_IDENTITY: ${{ steps.management-inputs.outputs.identity }}
          MANAGEMENT_RESULT: ${{ steps.management.outputs.result }}
          LAYERS: ${{ steps.rechunk.outputs.layers }}
          DIGEST: ${{ steps.push.outputs.digest }}
          WEBUI_VERSION: ${{ steps.webui.outputs.version }}
        run: |
          {
            echo "## JustVoxel Base testing"
            echo
            echo "- Home Server Base input: ${HOME_SERVER_BASE_IMAGE}"
            echo "- WebUI: ${WEBUI_VERSION:-unresolved}"
            echo "- Management API: v1"
            echo "- Internal Management package: ${MANAGEMENT_PACKAGE}"
            echo "- Management input: ${MANAGEMENT_IDENTITY:0:12}"
            echo "- Management Agent: ${MANAGEMENT_RESULT:-incomplete}"
            echo "- Rechunked layers: ${LAYERS:-unknown} / ${OCI_LAYER_LIMIT}"
            echo "- Moving tag: ${IMAGE_REPOSITORY}:${CURRENT_TAG}"
            echo "- Immutable tag: ${IMAGE_REPOSITORY}:${BUILD_TAG:-n/a}"
            echo "- Digest: ${DIGEST:-not-published}"
            echo "- Health: common + bootc lint"
          } >> "${GITHUB_STEP_SUMMARY}"

  cleanup:
    name: cleanup
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      packages: write

    steps:
      - name: Remove expired testing Base images
        uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f # v1.2.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          packages: justvoxel-base
          delete-tags: 'testing-*'
          exclude-tags: 'testing,stable,stable-*'
          older-than: 45 days
          keep-n-tagged: 7
          validate: true
