name: WebUI source

on:
  pull_request:
    branches: [testing]
    paths:
      - 'webui/**'
      - 'build_files/build-webui.sh'
      - 'tests/test-webui-source.sh'
      - '.github/workflows/webui-source.yml'

permissions:
  contents: read

jobs:
  test:
    name: WebUI source tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6
        with:
          go-version: '1.25.x'
          check-latest: true
          cache: false

      - name: Show New Storage formatting diff
        shell: bash
        run: |
          set -euo pipefail
          gofmt -d webui/internal/server/admin_discovery_page.go || true

      - name: Run WebUI source and local artifact checks
        shell: bash
        run: |
          set -euo pipefail
          bash tests/test-webui-source.sh "${GITHUB_SHA}"
