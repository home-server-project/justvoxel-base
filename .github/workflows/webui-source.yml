name: WebUI source

on:
  pull_request:
    branches: [testing]
    paths:
      - 'webui/**'
      - '.github/workflows/webui-source.yml'

permissions:
  contents: read

jobs:
  test:
    name: WebUI source tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6
        with:
          go-version: '1.25.x'
          check-latest: true
          cache: false

      - name: Validate WebUI milestone
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < webui/VERSION)"
          [[ "${version}" == "1.0.0-beta.8" ]]
          echo "WEBUI_VERSION=${version}" >> "${GITHUB_ENV}"

      - name: Format check
        shell: bash
        run: |
          set -euo pipefail
          cd webui
          test -z "$(gofmt -l .)"

      - name: Vet
        run: cd webui && go vet ./...

      - name: Test
        run: cd webui && go test ./...

      - name: Build static binary
        shell: bash
        env:
          CGO_ENABLED: '0'
        run: |
          set -euo pipefail
          cd webui
          go build -trimpath \
            -ldflags "-X github.com/home-server-project/justvoxel-webui/internal/version.Version=${WEBUI_VERSION} -X github.com/home-server-project/justvoxel-webui/internal/version.Commit=${GITHUB_SHA} -X github.com/home-server-project/justvoxel-webui/internal/version.ManagementAPI=v1" \
            -o /tmp/justvoxel-webui ./cmd/justvoxel-webui

      - name: Smoke version output
        shell: bash
        run: |
          set -euo pipefail
          output="$(/tmp/justvoxel-webui -version)"
          grep -Fqx "JustVoxel WebUI ${WEBUI_VERSION}" <<<"${output}"
          grep -Fqx "source=${GITHUB_SHA}" <<<"${output}"
          grep -Fqx "management-api=v1" <<<"${output}"
