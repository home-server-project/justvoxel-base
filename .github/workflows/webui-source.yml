name: WebUI source

on:
  pull_request:
    branches: [testing]
    paths:
      - 'webui/**'
      - '.github/workflows/webui-source.yml'

permissions:
  contents: read

jobs:
  test:
    name: WebUI source tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6
        with:
          go-version: '1.25.x'
          check-latest: true
          cache: false

      - name: Validate WebUI milestone
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < webui/VERSION)"
          [[ "${version}" == "1.0.0-beta.8" ]]
          echo "WEBUI_VERSION=${version}" >> "${GITHUB_ENV}"

      - name: Format check
        shell: bash
        run: |
          set -euo pipefail
          cd webui
          test -z "$(gofmt -l .)"

      - name: Vet
        run: cd webui && go vet ./...

      - name: Test
        run: cd webui && go test ./...

      - name: Build and verify local WebUI artifact
        shell: bash
        run: |
          set -euo pipefail
          ./build_files/build-webui.sh "${GITHUB_SHA}" build_artifacts/webui
          jq -e \
            --arg version "${WEBUI_VERSION}" \
            --arg commit "${GITHUB_SHA}" \
            '.version == $version and .source_commit == $commit and .management_api == "v1" and (.artifact_sha256 | test("^[0-9a-f]{64}$"))' \
            build_artifacts/webui/webui-release.json >/dev/null
