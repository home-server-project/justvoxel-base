name: WebUI source

on:
  pull_request:
    branches: [testing]
    paths:
      - 'webui/**'
      - 'build_files/build-webui.sh'
      - 'tests/test-webui-source.sh'
      - 'management/**'
      - 'mjust/libexec/admin-storage-actions-*'
      - '.github/workflows/webui-source.yml'

permissions:
  contents: read

jobs:
  test:
    name: WebUI source tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6
        with:
          go-version: '1.25.x'
          check-latest: true
          cache: false

      - name: Install management source-test dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libpam0g-dev libpwquality-dev

      - name: Check storage action shell syntax
        shell: bash
        run: |
          set -euo pipefail
          bash -n mjust/libexec/admin-storage-actions-common.sh
          bash -n mjust/libexec/admin-storage-actions-json
          bash -n mjust/libexec/admin-storage-actions-apply.sh

      - name: Run Management Agent source checks
        shell: bash
        run: |
          set -euo pipefail
          unformatted="$(gofmt -l management)"
          if [[ -n "${unformatted}" ]]; then
            echo 'ERROR: Management Agent Go source is not gofmt-clean:' >&2
            printf '%s\n' "${unformatted}" >&2
            exit 1
          fi
          cd management
          go mod download
          CGO_ENABLED=1 go vet ./...
          CGO_ENABLED=1 go test ./...
          CGO_ENABLED=1 go build -trimpath -o /tmp/management-agent ./cmd/justvoxel-management-agent
          /tmp/management-agent version

      - name: Run WebUI source and local artifact checks
        shell: bash
        run: |
          set -euo pipefail
          bash tests/test-webui-source.sh "${GITHUB_SHA}"
